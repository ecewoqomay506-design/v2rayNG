name: Build AryanVPN APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages and accept licenses
        shell: bash
        run: |
          set -e

          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build HEV tunnel libraries (optional)
        shell: bash
        run: |
          if [ -f compile-hevtun.sh ]; then
            bash compile-hevtun.sh
            if [ -d libs ]; then
              mkdir -p V2rayNG/app/libs
              cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true
            fi
          else
            echo "HEV build script not found; skipping."
          fi

      - name: Download libv2ray.aar
        shell: bash
        run: |
          set -e

          mkdir -p V2rayNG/app/libs

          TAG=""
          if [ -d AndroidLibXrayLite/.git ]; then
            TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0 2>/dev/null || true)
          fi

          if [ -n "$TAG" ]; then
            curl -fL --retry 3 --retry-delay 2 \
              -o V2rayNG/app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar" || true
          fi

          if [ ! -s V2rayNG/app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 --retry-delay 2 \
              -o /tmp/rel.json \
              https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest

            URL=$(python3 -c "
          import json
          with open('/tmp/rel.json', encoding='utf-8') as f:
              data = json.load(f)
          assets = data.get('assets', [])
          urls = [a['browser_download_url'] for a in assets if a['name'].endswith('.aar')]
          print(urls[0] if urls else '')
          ")

            if [ -z "$URL" ]; then
              echo "ERROR: No AAR asset found in the latest release."
              exit 1
            fi

            curl -fL --retry 3 --retry-delay 2 \
              -o V2rayNG/app/libs/libv2ray.aar "$URL"
          fi

          test -s V2rayNG/app/libs/libv2ray.aar
          ls -lh V2rayNG/app/libs/

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f V2rayNG/gradlew || {
            echo "ERROR: V2rayNG/gradlew not found."
            exit 1
          }

          test -f V2rayNG/settings.gradle || \
          test -f V2rayNG/settings.gradle.kts || {
            echo "ERROR: Gradle settings file not found in V2rayNG."
            exit 1
          }

      - name: Build debug APK
        working-directory: V2rayNG
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          ./gradlew --no-daemon assemblePlaystoreDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AryanVPN-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
